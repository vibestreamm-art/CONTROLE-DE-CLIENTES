
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CONTROLE-DE-CLIENTES/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: CONTROLE-DE-CLIENTES
        run: |
          rm -f local.properties
          bash gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Clientes-APK
          path: CONTROLE-DE-CLIENTES/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
